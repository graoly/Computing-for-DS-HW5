[project]
name = "diabetes-prediction"
version = "0.1.0"
description = "Library to predict diabetes mellitus using OOP"
readme = "README.md"
authors = [
    { name = "graoly", email = "roy.gal@mail.utoronto.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
