[project]
name = "diabetes-prediction"
version = "0.1.0"
description = "Class based components for diabetes mellitus data analysis"
readme = "README.md"
authors = [
    { name = "graoly", email = "roy.gal@mail.utoronto.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "geopy>=2.5.0",
    "jupyter>=1.1.1",
    "pandas>=2.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "scikit-learn>=1.5",
]



[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
